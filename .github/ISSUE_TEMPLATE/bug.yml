name: 🐛 Bug
description: A defect with severity, repro steps, and expected vs actual
labels: ["type:bug", "status:needs-triage"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["S1 critical", "S2 major", "S3 minor", "S4 cosmetic"]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: role, device/viewport, language, theme, network condition
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: console output, network trace, screenshot
  - type: checkboxes
    id: regression
    attributes:
      label: Regression requirement
      options:
        - label: Fix will include a regression test (fails before, passes after)
          required: true
